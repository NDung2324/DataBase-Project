{% extends 'base.html' %}{% block content %}<h1>Movie Catalog</h1><form method="get" class="filters"><input name="q" placeholder="Tìm phim theo tên" value="{{q}}"><select name="category"><option value="">Tất cả thể loại</option>{% for c in categories %}<option value="{{c.category}}" {% if selected_category==c.category %}selected{% endif %}>{{c.category}}</option>{% endfor %}</select><button>Tìm kiếm</button></form><div class="cards">{% for m in movies %}<article class="card"><span class="tag">{{m.category or 'Other'}}</span><h3>{{m.title}}</h3><p class="muted">{{m.content_id}} · {{m.duration}} phút · {{m.release_date}}</p><p>{{m.description or ''}}</p><a class="action-link" href="{{url_for('watch',content_id=m.content_id)}}">▶ Xem</a></article>{% else %}<p>Không tìm thấy phim.</p>{% endfor %}</div>{% endblock %}
